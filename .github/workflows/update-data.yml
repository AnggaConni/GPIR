name: Update trade data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 2"
permissions:
  contents: write
concurrency:
  group: gpir-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run transformation tests
        run: python -m unittest discover -s tests -v
      - name: Fetch trade data and enrich with World Bank context
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/fetch_data.py
      - name: Commit updated data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh global product signals"
            git push
          fi
