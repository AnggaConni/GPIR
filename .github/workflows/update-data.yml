name: GPIR CI and data refresh
on:
  push:
    paths:
      - "pipeline/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - "app.js"
      - "market-context.js"
      - "enterprise.html"
      - "enterprise.js"
      - "data/**"
      - "docs/**"
      - "README.md"
      - "index.html"
      - ".github/workflows/update-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 2"

permissions:
  contents: write

concurrency:
  group: gpir-data-refresh
  cancel-in-progress: false

jobs:
  test:
    name: Test transformations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run transformation tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: node --check app.js && node --check market-context.js && node --check enterprise.js
      - name: Validate JSON data files
        run: python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('data').glob('*.json')]; print('All data JSON files are valid')"

  refresh:
    name: Refresh open trade data
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch trade data and enrich with World Bank context
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/fetch_data.py
      - name: Commit updated data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh global product signals"
            git push
          fi
