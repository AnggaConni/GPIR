name: GPIR CI and data refresh
on:
  push:
    paths:
      - "pipeline/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - "app.js"
      - "market-context.js"
      - "local-home.js"
      - "i18n.js"
      - "enterprise.html"
      - "enterprise.js"
      - "data/**"
      - "docs/**"
      - "README.md"
      - "index.html"
      - "tourism.html"
      - "potential.html"
      - "tourism.js"
      - "potential.js"
      - ".github/workflows/update-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 2"

permissions:
  contents: write

concurrency:
  group: gpir-data-refresh
  cancel-in-progress: false

jobs:
  test:
    name: Test transformations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run transformation tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript and trade-flow Python syntax
        run: python -m py_compile pipeline/fetch_trade_flows.py && node --check app.js && node --check market-context.js && node --check local-home.js && node --check i18n.js && node --check enterprise.js && node --check tourism.js && node --check potential.js
      - name: Validate JSON data files
        run: python -c "import json,pathlib; files=list(pathlib.Path('data').rglob('*.json')); [json.loads(p.read_text(encoding='utf-8')) for p in files]; print(f'All {len(files)} data JSON files are valid')"

  refresh:
    name: Refresh open trade data
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch quota-limited UN Comtrade trade data
        env:
          COMTRADE_API_KEY: ${{ secrets.UN_COMTRADE_API_KEY || secrets.COMTRADE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/fetch_data.py
      - name: Fetch selected bilateral import relationships
        env:
          COMTRADE_API_KEY: ${{ secrets.UN_COMTRADE_API_KEY || secrets.COMTRADE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/fetch_trade_flows.py
      - name: Refresh tourism, heritage and packaged-food snapshots
        env:
          OPENTRIPMAP_API_KEY: ${{ secrets.OPENTRIPMAP_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/fetch_tourism_data.py
      - name: Refresh official UN Tourism bulk statistics
        id: un-tourism-bulk
        continue-on-error: true
        env:
          UN_TOURISM_BULK_URL: ${{ vars.UN_TOURISM_BULK_URL || 'https://pre-webunwto.s3.amazonaws.com/s3fs-public/2026-05/UN_Tourism_bulk_data_download_05_2026.zip' }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/import_un_tourism_bulk.py --refresh-download
      - name: Report UN Tourism archive availability
        if: steps.un-tourism-bulk.outcome == 'failure'
        run: echo "::warning::UN Tourism bulk refresh failed; the prior committed JSON snapshot will be retained."
      - name: Commit updated data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/trade_flows.json data/tourism_places.json data/ich_heritage.json data/designated_sites.json data/food_products.json data/tourism_stats.json data/un_tourism/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh global product signals"
            # Data collection can take several minutes; main may advance while it runs.
            # Rebase this generated snapshot onto the latest main before pushing.
            git fetch --no-tags --deepen=50 origin +refs/heads/main:refs/remotes/origin/main
            git rebase origin/main
            git push origin HEAD:main
          fi


  bootstrap-trade-flows:
    name: Bootstrap bilateral trade-flow snapshot
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'bootstrap-bilateral-flows')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build bilateral import routes
        env:
          COMTRADE_API_KEY: ${{ secrets.UN_COMTRADE_API_KEY || secrets.COMTRADE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/fetch_trade_flows.py
      - name: Commit route snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+AnggaConni@users.noreply.github.com"
          git add data/trade_flows.json
          if git diff --cached --quiet; then
            echo "No bilateral flow changes."
          else
            git commit -m "chore(data): bootstrap bilateral import flow snapshot"
            git fetch --no-tags --deepen=50 origin +refs/heads/main:refs/remotes/origin/main
            git rebase origin/main
            git push origin HEAD:main
          fi

  refresh-tourism:
    name: Refresh tourism and culture snapshots
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'bootstrap-tourism-snapshot')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh tourism, heritage and packaged-food snapshots
        env:
          OPENTRIPMAP_API_KEY: ${{ secrets.OPENTRIPMAP_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/fetch_tourism_data.py
      - name: Commit tourism snapshots only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tourism_places.json data/ich_heritage.json data/designated_sites.json data/food_products.json data/tourism_stats.json
          if git diff --cached --quiet; then
            echo "No tourism snapshot changes."
          else
            git commit -m "chore(data): refresh tourism and culture snapshots"
            git fetch --no-tags --deepen=50 origin +refs/heads/main:refs/remotes/origin/main
            git rebase origin/main
            git push origin HEAD:main
          fi
